<!DOCTYPE html>

<!-- Fig. 11.17: FavoriteTwitterSearchs.html -->
<!-- Aplicación web de búsquedas favoritas de Twitter. -->
<html>
<head>
   <title>Búsquedas de Twitter | Práctica</title>
   <link rel = "stylesheet" type = "text/css" href = "style4.css">
   <script src = "FavoriteTwitterSearches.js"></script>
</head>
<body>
    <!-- Versión con ajustes ligeros de presentación. -->
   <h1>Búsquedas favoritas de Twitter</h1>
   <p id = "welcomeMessage"></p>
   <form action = "#">
      <p><input id = "query" type = "text" 
         placeholder = "Introduzca la consulta de búsqueda de Twitter">
         <a href = "https://dev.twitter.com/docs/using-search">
            Operadores de búsqueda de Twitter</a></p>
      <p><input id = "tag" type = "text" placeholder = "Etiquete su consulta">
         <input type = "button" value = "Guardar" 
            id = "saveButton">
         <input type = "button" value = "Borrar todas las búsquedas guardadas"
            id = "clearButton"></p>
   </form>
   <h1>Búsquedas etiquetadas anteriormente</h1>
   <div id = "searches"></div>
</body>
</html>
