<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 11.4 - Redondeo con Math (Deitel) | Práctica</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        input { padding: 5px; width: 150px; }
        button { padding: 6px 12px; cursor: pointer; }
        .resultado { margin-top: 15px; background: #f4f4f4; padding: 15px; border-radius: 5px; width: 400px; }
    </style>
</head>
<body>
    <!-- Versión con ajustes ligeros de presentación. -->
    <h1>Ejercicio 11.4: Funciones de Redondeo</h1>
    <p>Ingrese un número de punto flotante para ver sus diferentes redondeos[cite: 10]:</p>
    
    <label for="numeroInput">Número (ej. 37.698): </label>
    <input type="number" id="numeroInput" step="any" value="37.698">
    <button id="btnRedondear">Calcular</button>

    <div class="resultado" id="divResultados">
        Ingrese un número y haga clic en Calcular.
    </div>

    <script>
        // Definición de las cuatro funciones solicitadas
        function redondearAEntero(numero) {
            return Math.floor(numero + 0.5);
        }

        function redondearADecimas(numero) {
            return Math.floor(numero * 10 + 0.5) / 10;
        }

        function redondearACentesimas(numero) {
            return Math.floor(numero * 100 + 0.5) / 100;
        }

        function redondearAMilesimas(numero) {
            return Math.floor(numero * 1000 + 0.5) / 1000;
        }

        document.getElementById('btnRedondear').addEventListener('click', function() {
            let x = parseFloat(document.getElementById('numeroInput').value);

            if (isNaN(x)) {
                alert("Por favor ingrese un número válido.");
                return;
            }

            let html = `
                <strong>Valor original:</strong> ${x}<br>
                <strong>Redondear a Entero:</strong> ${redondearAEntero(x)}<br>
                <strong>Redondear a Décimas:</strong> ${redondearADecimas(x)}<br>
                <strong>Redondear a Centésimas:</strong> ${redondearACentesimas(x)}<br>
                <strong>Redondear a Milésimas:</strong> ${redondearAMilesimas(x)}
            `;

            document.getElementById('divResultados').innerHTML = html;
        });
    </script>
</body>
</html>
