<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 11.20 - Propio lastIndexOf (Deitel) | Práctica</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .campo { margin-bottom: 10px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { padding: 6px; width: 350px; }
        button { padding: 6px 12px; cursor: pointer; }
        .resultado { margin-top: 15px; background: #f4f4f4; padding: 15px; border-radius: 5px; width: 400px; }
    </style>
</head>
<body>
    <!-- Versión con ajustes ligeros de presentación. -->
    <h1>Ejercicio 11.20: Implementación personalizada de lastIndexOf</h1>
    
    <form id="formLastIndex">
        <div class="campo">
            <label for="cadenaPrincipal">Cadena principal:</label>
            <input type="text" id="cadenaPrincipal" value="bananaana" required>
        </div>
        <div class="campo">
            <label for="subcadena">Subcadena a buscar:</label>
            <input type="text" id="subcadena" value="ana" required>
        </div>
        <button type="submit">Buscar Último Índice</button>
    </form>

    <div class="resultado" id="divResultado">
        Ingrese los datos y presione Buscar.
    </div>

    <script>
        // Versión propia del método lastIndexOf
        function miLastIndexOf(str, busqueda) {
            let n = str.length;
            let m = busqueda.length;

            if (m === 0) return n;
            if (m > n) return -1;

            // Recorrer de derecha a izquierda
            for (let i = n - m; i >= 0; i--) {
                let coincide = true;
                for (let j = 0; j < m; j++) {
                    if (str.charAt(i + j) !== busqueda.charAt(j)) {
                        coincide = false;
                        break;
                    }
                }
                if (coincide) {
                    return i; // Retorna el índice de la última coincidencia
                }
            }
            return -1;
        }

        document.getElementById('formLastIndex').addEventListener('submit', function(e) {
            e.preventDefault();
            let principal = document.getElementById('cadenaPrincipal').value;
            let busqueda = document.getElementById('subcadena').value;

            let indicePersonalizado = miLastIndexOf(principal, busqueda);
            let indiceNativo = principal.lastIndexOf(busqueda);

            document.getElementById('divResultado').innerHTML = `
                <p><strong>Resultado con miLastIndexOf:</strong> ${indicePersonalizado}</p>
                <p><strong>Resultado con String.lastIndexOf nativo:</strong> ${indiceNativo}</p>
            `;
        });
    </script>
</body>
</html>
