<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 11.24 - Protección de Cheques (Deitel) | Práctica</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .campo { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="number"] { padding: 8px; width: 200px; }
        button { padding: 8px 15px; cursor: pointer; }
        .cheque-box {
            margin-top: 20px;
            background: #fff;
            border: 2px solid #333;
            padding: 20px;
            width: 300px;
            font-family: monospace;
            font-size: 18px;
            box-shadow: 3px 3px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <!-- Versión con ajustes ligeros de presentación. -->
    <h1>Ejercicio 11.24: Protección de Cheques</h1>
    <p>Ingrese el monto del cheque para aplicar la técnica de protección con asteriscos (9 espacios disponibles)[cite: 22]:</p>
    
    <form id="formCheque">
        <div class="campo">
            <label for="montoInput">Monto ($):</label>
            <input type="number" id="montoInput" step="0.01" min="0" max="999999.99" value="99.87" required>
        </div>
        <button type="submit">Imprimir Cheque Protegido</button>
    </form>

    <div class="cheque-box" id="divCheque">
        <div>Monto protegido:</div>
        <div id="resultadoCheque" style="font-weight: bold; margin-top: 10px; font-size: 22px;">***99.87</div>
        <div style="font-size: 12px; color: #666; margin-top: 5px;">---------</div>
        <div style="font-size: 12px; color: #666;">123456789 (posiciones)</div>
    </div>

    <script>
        document.getElementById('formCheque').addEventListener('submit', function(e) {
            e.preventDefault();

            let monto = parseFloat(document.getElementById('montoInput').value);

            if (isNaN(monto) || monto < 0) {
                alert("Por favor ingrese un monto válido.");
                return;
            }

            // Formatear a dos decimales estrictos (ej. "99.87" o "1230.60")
            let montoStr = monto.toFixed(2);

            const espaciosDisponibles = 9;[cite: 22]

            if (montoStr.length > espaciosDisponibles) {
                alert("El monto es demasiado grande para los espacios disponibles en el cheque.");
                return;
            }

            // Rellenar con asteriscos a la izquierda hasta completar 9 caracteres[cite: 22]
            let montoProtegido = montoStr.padStart(espaciosDisponibles, '*');

            // Mostrar el resultado en el diseño del cheque
            document.getElementById('resultadoCheque').textContent = montoProtegido;
        });
    </script>
</body>
</html>
