<!DOCTYPE html>

<!-- Fig. 6.5: bienvenido4.html -->
<!-- Cuadro de entrada (prompt) utilizado en una pantalla de bienvenida. -->
<html>
   <head> 
      <meta charset = "utf-8">
      <title>Uso de Cuadros de Entrada y de Alerta</title>
      <script>

         var name; // cadena introducida por el usuario

         // lee el nombre desde el cuadro de entrada como una cadena
         name = window.prompt( "Por favor introduzca su nombre" );

         document.writeln( "<h1>&iexcl;Hola " + name + 
            ", bienvenido a la programaci&oacute;n en JavaScript!</h1>" );

      </script>
   </head><body></body>
</html>
