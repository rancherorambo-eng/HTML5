<!DOCTYPE html>

<!-- Fig. 6.7: suma.html -->
<!-- Script de suma. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Un Programa de Suma</title>
      <script>

         var firstNumber; // primera cadena introducida por el usuario
         var secondNumber; // segunda cadena introducida por el usuario
         var number1; // primer n&uacute;mero a sumar
         var number2; // segundo n&uacute;mero a sumar
         var sum; // suma de number1 y number2

         // lee el primer n&uacute;mero del usuario como una cadena
         firstNumber = window.prompt( "Escriba el primer entero" );

         // lee el segundo n&uacute;mero del usuario como una cadena
         secondNumber = window.prompt( "Escriba el segundo entero" );

         // convierte los n&uacute;meros de cadenas a enteros
         number1 = parseInt( firstNumber ); 
         number2 = parseInt( secondNumber );
         
         sum = number1 + number2; // suma los n&uacute;meros

         // despliega los resultados
         document.writeln( "<h1>La suma es " + sum + "</h1>" );

      </script>
   </head><body></body>
</html>
