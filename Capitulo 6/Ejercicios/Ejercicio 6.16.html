<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 6.16</title>
</head>
<body>
    <h1>Resultados de Operaciones</h1>
    <script>
        let num1 = window.prompt("Escriba el primer número:");
        let num2 = window.prompt("Escriba el segundo número:");

        let n1 = parseFloat(num1);
        let n2 = parseFloat(num2);

        let suma = n1 + n2;
        let producto = n1 * n2;
        let diferencia = n1 - n2;
        let cociente = n1 / n2;

        document.writeln("<p><strong>Suma:</strong> " + suma + "</p>");
        document.writeln("<p><strong>Producto:</strong> " + producto + "</p>");
        document.writeln("<p><strong>Diferencia:</strong> " + diferencia + "</p>");
        document.writeln("<p><strong>Cociente:</strong> " + cociente + "</p>");
    </script>
</body>
</html>
