<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 6.21</title>
</head>
<body>
    <h1>Par o Impar</h1>
    <script>
        let entrada = window.prompt("Introduzca un número entero:");
        let numero = parseInt(entrada, 10);

        if (numero % 2 === 0) {
            document.writeln("<p>El número <strong>" + numero + "</strong> es <strong>PAR</strong>.</p>");
        } else {
            document.writeln("<p>El número <strong>" + numero + "</strong> es <strong>IMPAR</strong>.</p>");
        }
    </script>
</body>
</html>
