<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3.8 - Autocomplete con Datalist</title>
</head>
<body>

    <h1>Selección de Día de la Semana</h1>

    <form action="#" method="get">
        <p>
            <label for="dia_semana">Seleccione o escriba un día de la semana:</label><br>
            <input type="text" id="dia_semana" name="dia_semana" list="dias" placeholder="Ej. Lunes">
            
            <datalist id="dias">
                <option value="Lunes">
                <option value="Martes">
                <option value="Miércoles">
                <option value="Jueves">
                <option value="Viernes">
                <option value="Sábado">
                <option value="Domingo">
            </datalist>
        </p>
        <p>
            <input type="submit" value="Enviar">
        </p>
    </form>

</body>
</html>
