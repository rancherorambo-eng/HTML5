<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3.7 - Formulario de Búsqueda con Autocomplete</title>
</head>
<body>

    <h1>Formulario de Búsqueda Simple</h1>
    <p>Introduce un término de búsqueda y haz clic en Buscar para registrar el historial en el navegador.</p>

    <form action="#" method="get" autocomplete="on">
        <p>
            <label for="busqueda">Buscar:</label>
            <input type="search" id="busqueda" name="q" placeholder="Escribe aquí..." autofocus required>
            <input type="submit" value="Buscar">
        </p>
    </form>

</body>
</html>
