<!DOCTYPE html>

<!-- Fig. 9.4: EnteroAleatorio.html -->
<!-- Enteros aleatorios, desplazamiento y escalamiento. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Enteros Aleatorios Desplazados y Escalados</title>
      <style type = "text/css">
         p, ol { margin: 0; }
         li    { display: inline; margin-right: 10px; }
      </style>
      <script>

         var valor;

         document.writeln( "<p>Números Aleatorios</p><ol>" );
      
         for ( var i = 1; i <= 30; ++i ) 
         {
            valor = Math.floor( 1 + Math.random() * 6 );
            document.writeln( "<li>" + valor + "</li>" );
         } // fin de for

         document.writeln( "</ol>" );

      </script>
   </head><body></body>
</html>
