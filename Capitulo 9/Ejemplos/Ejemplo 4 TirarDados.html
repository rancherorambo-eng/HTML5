<!DOCTYPE html>

<!-- Fig. 9.5: TirarDados.html -->
<!-- Generación de imágenes aleatorias de dados usando Math.random. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Imágenes Aleatorias de Dados</title> 
      <style type = "text/css">
         li { display: inline; margin-right: 10px; }
         ul { margin: 0; }
      </style>
      <script>
         // variables utilizadas para interactuar con los elementos img
         var imagenDado1;
         var imagenDado2;
         var imagenDado3;
         var imagenDado4;

         // registrar el escuchador del botón y obtener los elementos img
         function iniciar()
         {
            var boton = document.getElementById( "botonLanzar" );
            boton.addEventListener( "click", lanzarDados, false );
            imagenDado1 = document.getElementById( "dado1" );
            imagenDado2 = document.getElementById( "dado2" );
            imagenDado3 = document.getElementById( "dado3" );
            imagenDado4 = document.getElementById( "dado4" );
         } // fin de la función iniciar

         // lanzar los dados
         function lanzarDados()
         {
            establecerImagen( imagenDado1 );
            establecerImagen( imagenDado2 );
            establecerImagen( imagenDado3 );
            establecerImagen( imagenDado4 );
         } // fin de la función lanzarDados

         // establecer los atributos src y alt para un dado
         function establecerImagen( imagenDado )
         {
            var valorDado = Math.floor( 1 + Math.random() * 6 );
            imagenDado.setAttribute( "src", "../Imagenes/dado" + valorDado + ".png" );
            imagenDado.setAttribute( "alt", 
               "imagen de dado con " + valorDado + " punto(s)" );
         } // fin de la función establecerImagen

         window.addEventListener( "load", iniciar, false );
      </script>
   </head>
   <body>
      <form action = "#">
         <input id = "botonLanzar" type = "button" value = "Lanzar Dados">
      </form>
      <ol>
         <li><img id = "dado1" src = "../Imagenes/blanco.png" alt = "imagen en blanco"></li>
         <li><img id = "dado2" src = "../Imagenes/blanco.png" alt = "imagen en blanco"></li>
         <li><img id = "dado3" src = "../Imagenes/blanco.png" alt = "imagen en blanco"></li>
         <li><img id = "dado4" src = "../Imagenes/blanco.png" alt = "imagen en blanco"></li>
      </ol>
   </body>
</html>
