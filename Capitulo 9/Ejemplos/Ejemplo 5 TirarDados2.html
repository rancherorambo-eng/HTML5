<!DOCTYPE html>

<!-- Fig. 9.6: TirarDados.html -->
<!-- Lanzamiento de 12 dados y visualización de frecuencias. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Frecuencias de Lanzamiento de Dados</title> 
      <style type = "text/css">
         img           { margin-right: 10px; }
         table         { width: 200px;
                         border-collapse: collapse; 
                         background-color: lightblue; }
         table, td, th { border: 1px solid black; 
                         padding: 4px; 
                         margin-top: 20px; }
         th            { text-align: left; 
                         color: white;
                         background-color: darkblue; }
      </style>
      <script>
         var frecuencia1 = 0; 
         var frecuencia2 = 0;
         var frecuencia3 = 0;
         var frecuencia4 = 0;
         var frecuencia5 = 0; 
         var frecuencia6 = 0;
         var totalDados = 0;

         // registrar el manejador de eventos del botón
         function iniciar()
         {
            var boton = document.getElementById( "botonTirar" );
            boton.addEventListener( "click", tirarDados, false );
         } // fin de la función iniciar

         // lanzar los dados
         function tirarDados()
         {
            var cara; // cara obtenida

            // ciclo para lanzar el dado 12 veces
            for ( var i = 1; i <= 12; ++i ) 
            {
               cara = Math.floor( 1 + Math.random() * 6 );
               comprobarLanzamientos( cara ); // incrementar contador de frecuencia
               establecerImagen( i, cara ); // mostrar la imagen apropiada del dado
               ++totalDados; // incrementar el total 
            } // fin del ciclo de lanzamiento de dados

            actualizarTablaFrecuencias();
         } // fin de la función tirarDados

         // incrementar el contador de frecuencia apropiado
         function comprobarLanzamientos( cara )
         {
            switch ( cara ) 
            {
               case 1:
                  ++frecuencia1;
                  break;
               case 2:
                  ++frecuencia2;
                  break;
               case 3:
                  ++frecuencia3;
                  break;
               case 4:
                  ++frecuencia4;
                  break;
               case 5:
                  ++frecuencia5;
                  break;
               case 6:
                  ++frecuencia6;
                  break;
            } // fin de switch
         } // fin de la función comprobarLanzamientos

         // establecer la fuente de la imagen para un dado
         function establecerImagen( numeroDado, cara )
         {
            var imgDado = document.getElementById( "dado" + numeroDado );
            imgDado.setAttribute( "src", "../Imagenes/dado" + cara + ".png" ); 
            imgDado.setAttribute( "alt", "dado con " + cara + " punto(s)" ); 
         } // fin de la función establecerImagen
   
         // actualizar la tabla de frecuencias en la página
         function actualizarTablaFrecuencias()
         {
            var divTabla = document.getElementById( "divTablaFrecuencias" );

            divTabla.innerHTML = "<table>" + 
               "<caption>Frecuencias al lanzar los dados</caption>" +
               "<thead><th>Cara</th><th>Frecuencia</th>" + 
               "<th>Porcentaje</th></thead>" +
               "<tbody><tr><td>1</td><td>" + frecuencia1 + "</td><td>" + 
               formatearPorcentaje(frecuencia1 / totalDados) + "%</td></tr>" +
               "<tr><td>2</td><td>" + frecuencia2 + "</td><td>" + 
               formatearPorcentaje(frecuencia2 / totalDados)+ "%</td></tr>" +
               "<tr><td>3</td><td>" + frecuencia3 + "</td><td>" + 
               formatearPorcentaje(frecuencia3 / totalDados) + "%</td></tr>" +
               "<tr><td>4</td><td>" + frecuencia4 + "</td><td>" + 
               formatearPorcentaje(frecuencia4 / totalDados) + "%</td></tr>" +
               "<tr><td>5</td><td>" + frecuencia5 + "</td><td>" + 
               formatearPorcentaje(frecuencia5 / totalDados) + "%</td></tr>" +
               "<tr><td>6</td><td>" + frecuencia6 + "</td><td>" + 
               formatearPorcentaje(frecuencia6 / totalDados) + "%</td></tr>" +
               "</tbody></table>";
         } // fin de la función actualizarTablaFrecuencias

         // formatear porcentaje
         function formatearPorcentaje( valor )
         {
            valor *= 100;
            return valor.toFixed(2);
         } // fin de la función formatearPorcentaje

         window.addEventListener( "load", iniciar, false );
      </script>
   </head>
   <body>
      <p><img id = "dado1" src = "../Imagenes/blanco.png" alt = "imagen del dado 1">
         <img id = "dado2" src = "../Imagenes/blanco.png" alt = "imagen del dado 2">
         <img id = "dado3" src = "../Imagenes/blanco.png" alt = "imagen del dado 3">
         <img id = "dado4" src = "../Imagenes/blanco.png" alt = "imagen del dado 4">
         <img id = "dado5" src = "../Imagenes/blanco.png" alt = "imagen del dado 5">
         <img id = "dado6" src = "../Imagenes/blanco.png" alt = "imagen del dado 6"></p>
      <p><img id = "dado7" src = "../Imagenes/blanco.png" alt = "imagen del dado 7">
         <img id = "dado8" src = "../Imagenes/blanco.png" alt = "imagen del dado 8">
         <img id = "dado9" src = "../Imagenes/blanco.png" alt = "imagen del dado 9">
         <img id = "dado10" src = "../Imagenes/blanco.png" alt = "imagen del dado 10">
         <img id = "dado11" src = "../Imagenes/blanco.png" alt = "imagen del dado 11">
         <img id = "dado12" src = "../Imagenes/blanco.png" alt = "imagen del dado 12"></p>
      <form action = "#">
         <input id = "botonTirar" type = "button" value = "Tirar dados">
      </form>
      <div id = "divTablaFrecuencias"></div>
   </body>
</html>
