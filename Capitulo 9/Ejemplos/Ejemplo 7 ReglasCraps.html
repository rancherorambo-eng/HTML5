<!DOCTYPE html>

<!-- Fig. 9.8: ReglasCraps.html -->
<!-- Página web con un video de las reglas básicas para el juego de dados Craps. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Reglas de Craps</title>
   </head>
   <body>
      <p><a href = "Craps.html">Volver al Juego de Craps</a></p> 
      <video controls>
         <source src = "../Imagenes/ReglasCraps.mp4" type = "video/mp4">
         <source src = "../Imagenes/ReglasCraps.webm" type = "video/webm">
         Un jugador tira dos dados. Cada dado tiene seis caras que contienen
         uno, dos, tres, cuatro, cinco y seis puntos, respectivamente. Se
         calcula la suma de los puntos en las dos caras superiores. Si la
         suma es 7 u 11 en el primer tiro, el jugador gana. Si la suma
         es 2, 3 o 12 en el primer tiro (llamado "craps"), el jugador
         pierde (es decir, la "casa" gana). Si la suma es 4, 5, 6, 8, 9 o
         10 en el primer tiro, esa suma se convierte en el "punto" del jugador.
         Para ganar, debe continuar tirando los dados hasta que "haga su
         punto" (es decir, tire su valor de punto). Usted pierde si tira un 7
         antes de hacer el punto.
      </video>
   </body>
</html>
