<!DOCTYPE html>

<!-- Fig. 7.21: ejercicio7_21.html -->
<!-- Múltiplos/potencias de 2 en un ciclo infinito. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Múltiplos de 2 (Ciclo Infinito)</title>
      <script>

         var multiplo = 2;

         // Ciclo infinito deliberado
         while ( true )
         {
            document.writeln( "<p>" + multiplo + "</p>" );
            multiplo = multiplo * 2;
         } // fin de while

      </script>
   </head><body></body>
</html>
