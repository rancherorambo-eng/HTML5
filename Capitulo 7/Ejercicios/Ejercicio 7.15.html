<!DOCTYPE html>

<!-- Fig. 7.15: ejercicio7_15.html -->
<!-- Determinar el valor más grande de 10 números ingresados por el usuario. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Encontrar el Número Mayor</title>
      <script>

         var contador = 1; // cuenta las 10 entradas
         var numero; // entero más reciente introducido
         var mayor = 0; // número más grande encontrado hasta ahora

         while ( contador <= 10 )
         {
            numero = parseInt( window.prompt( "Introduzca el número " + contador + " de 10:", "0" ) );

            if ( contador === 1 )
            {
               mayor = numero; // inicializar con la primera entrada
            }
            else if ( numero > mayor )
            {
               mayor = numero;
            }

            contador++;
         } // fin de while

         document.writeln( "<h1>Resultado</h1>" );
         document.writeln( "<p>El número más grande introducido es: " + mayor + "</p>" );

      </script>
   </head><body></body>
</html>
