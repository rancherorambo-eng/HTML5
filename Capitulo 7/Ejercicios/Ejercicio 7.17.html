<!DOCTYPE html>

<!-- Fig. 7.17: ejercicio7_17.html -->
<!-- Determinar los dos números más grandes de 10 entradas. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Encontrar los Dos Números Mayores</title>
      <script>

         var contador = 1;
         var numero;
         var mayor1 = -Infinity; // el más grande de todos
         var mayor2 = -Infinity; // el segundo más grande

         while ( contador <= 10 )
         {
            numero = parseInt( window.prompt( "Introduzca el número " + contador + " de 10:", "0" ) );

            if ( contador === 1 )
            {
               mayor1 = numero;
            }
            else
            {
               if ( numero > mayor1 )
               {
                  mayor2 = mayor1; // el antiguo número 1 pasa a ser el número 2
                  mayor1 = numero; // nuevo número 1
               }
               else if ( mayor2 === -Infinity || numero > mayor2 )
               {
                  mayor2 = numero; // nuevo número 2
               }
            }

            contador++;
         } // fin de while

         document.writeln( "<h1>Resultados</h1>" );
         document.writeln( "<p>El número más grande (primer lugar) es: " + mayor1 + "</p>" );
         document.writeln( "<p>El segundo número más grande (segundo lugar) es: " + mayor2 + "</p>" );

      </script>
   </head><body></body>
</html>
