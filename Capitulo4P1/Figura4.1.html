<!DOCTYPE html>

<!-- Fig. 4.1: inline.html -->
<!-- Uso de estilos en línea -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Estilos en línea</title>
   </head>
   <body>
      <p>Este texto no tiene ningún estilo aplicado.</p>

      <!-- El atributo style permite declarar -->
      <!-- estilos en línea. Debes separar varias -->
      <!-- propiedades de estilo con punto y coma. -->
      <p style = "font-size: 20pt;">Este texto tiene aplicado el estilo 
         <em>font-size</em> lo que hace que tenga un tamaño de 20pt.
      </p>

      <p style = "font-size: 20pt; color: deepskyblue;">
         Este texto tiene aplicado el estilo <em>font-size</em> y 
         <em>color</em>, lo que hace que tenga un tamaño de
         20pt y un color azul cielo intenso.</p>
   </body>
</html>
