<!DOCTYPE html>

<!-- Fig 4.9: positioning.html -->
<!-- Posicionamiento absoluto de elementos. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Posicionamiento absoluto</title>
      <style type = "text/css">
      .background_image   { position: absolute;
                 top: 0px;
                 left: 0px;
                 z-index: 1; }
      .foreground_image   { position: absolute;
                 top: 25px;
                 left: 100px;
                 z-index: 2; }
      .text    { position: absolute;
                 top: 25px;
                 left: 100px;
                 z-index: 3;
                 font-size: 20pt;
                 font-family: tahoma, geneva, sans-serif; } 
      </style>
   </head>
   <body>
      <p><img src = "background_image.png" class = "background_image"
         alt = "Primera imagen posicionada" /></p>
      
      <p><img src = "foreground_image.png" class = "foreground_image"
         alt = "Segunda imagen posicionada" /></p>
      
      <p class = "text">Texto posicionado</p>
   </body>
</html>
