<!DOCTYPE html>

<!-- Fig. 2.9: contacto2.html -->
<!-- Inserción de caracteres especiales. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Página de Contacto</title>
   </head>

   <body>
      <p>
         <a href = "mailto:deitel@deitel.com">Envía un correo a 
         Deitel &amp; Associates, Inc.</a>.
      </p>

      <hr> <!-- inserta una regla horizontal -->

      <!-- los caracteres especiales se ingresan -->
      <!-- usando la forma &codigo; -->
      <p>Toda la información en este sitio es <strong>&copy;
         Deitel & Associates, Inc. 2012.</strong> </p>

      <!-- para tachar texto se usa el elemento <del> -->
      <!-- para subíndice se usa el elemento <sub> -->
      <!-- para superíndice se usa el elemento <sup> -->
      <!-- estos elementos se anidan dentro de otros elementos -->
      <p><del>Puedes descargar 3.14 x 10<sup>2</sup> 
         caracteres de información desde este sitio.</del>  
         El primer elemento de la serie es x<sub>1</sub>.</p>
      <p>Nota: &lt; &frac14; de la información 
         presentada aquí se actualiza a diario.</p>
   </body>
</html>
