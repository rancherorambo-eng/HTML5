<!DOCTYPE html>
<!-- Ejercicio 2.15: Tabla con encabezado (thead), cuerpo (tbody) y pie (tfoot),
     tal como se muestra en la figura 2.19 del libro. -->
<html>
<head>
    <meta charset="utf-8">
    <title>Ejercicio 2.15</title>
</head>
<body>
    <h1>Página de ejemplo de tabla</h1>
    <p>Esta es una tabla de muestra pequeña.</p>
    <table border="1" cellpadding="5">
        <thead>
            <tr>
                <th colspan="2">Encabezado de la tabla</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="2">Este es el cuerpo</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">Este es el pie de la tabla</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
