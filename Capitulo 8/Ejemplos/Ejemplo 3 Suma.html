<!DOCTYPE html>

<!-- Fig. 8.5: Suma.html -->
<!-- Suma mediante la estructura de repetición for. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Suma de los Enteros Pares de 2 a 100</title> 
      <script>

         var suma = 0;

         for ( var numero = 2; numero <= 100; numero += 2 )
            suma += numero;

         document.writeln( "La suma de los enteros pares " +
            "de 2 a 100 es " + suma );

      </script>
   </head><body></body>
</html>
