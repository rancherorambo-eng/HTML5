<!DOCTYPE html>

<!-- Fig. 8.1: ContadorWhile.html -->
<!-- Repetición controlada por contador. -->
<html>
   <head>   
      <meta charset = "utf-8">
      <title>Repetición Controlada por Contador</title>
      <script>

         var contador = 1; // inicialización

         while ( contador <= 7 ) // condición de repetición
         {
            document.writeln( "<p style = 'font-size: " + 
               contador + "ex'>Tamaño de fuente de HTML5 " + contador + "ex</p>" );
            ++contador; // incremento
         } // fin del while

      </script>
   </head><body></body>
</html>
