<!DOCTYPE html>

<!-- Fig. 8.6: ejercicio8_6.html -->
<!-- Determinar el menor de varios enteros especificados por el usuario. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Encontrar el Menor de Varios Enteros</title>
      <script>

         var totalValores; // número de valores a procesar
         var numero; // valor entero ingresado por el usuario
         var menor; // el menor número encontrado

         // El primer valor especifica cuántos números se introducirán
         totalValores = parseInt( window.prompt( "Introduzca el número de valores a procesar:", "1" ) );

         for ( var i = 1; i <= totalValores; ++i )
         {
            numero = parseInt( window.prompt( "Introduzca el entero no negativo " + i + " de " + totalValores + ":", "0" ) );

            if ( i === 1 )
            {
               menor = numero; // inicializar con el primer entero ingresado
            }
            else if ( numero < menor )
            {
               menor = numero;
            }
         } // fin de for

         document.writeln( "<h1>Resultado</h1>" );
         document.writeln( "<p>Se procesaron " + totalValores + " valores.</p>" );
         document.writeln( "<p>El menor de los enteros ingresados es: <strong>" + menor + "</strong></p>" );

      </script>
   </head><body></body>
</html>
