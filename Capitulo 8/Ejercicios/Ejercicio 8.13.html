<!DOCTYPE html>

<!-- Fig. 8.13: ejercicio8_13.html -->
<!-- Evaluación de la instrucción switch con diferentes valores de k. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 8.13 - Evaluación de switch</title>
      <style type = "text/css">
         body {
            font-family: Arial, sans-serif;
            margin: 20px;
         }
         table {
            border-collapse: collapse;
            width: 350px;
         }
         table, th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
         }
         th {
            background-color: #2c3e50;
            color: white;
         }
      </style>
      <script>

         function evaluarSwitch( kInicial )
         {
            var k = kInicial;
            var x;

            switch ( k )
            {
               case 1:
                  break;
               case 2:
               case 3:
                  ++k;
                  break;
               case 4:
                  --k;
                  break;
               default:
                  k *= 3;
            } // fin de switch

            x = k;
            return x;
         }

         document.writeln( "<h1>Resultados del Ejercicio 8.13</h1>" );
         document.writeln( "<table>" );
         document.writeln( "<thead><tr><th>Valor inicial de k</th><th>Valor asignado a x</th></tr></thead>" );
         document.writeln( "<tbody>" );

         var valoresPrueba = [ 1, 2, 3, 4, 10 ];

         for ( var i = 0; i < valoresPrueba.length; ++i )
         {
            var kVal = valoresPrueba[ i ];
            var xVal = evaluarSwitch( kVal );
            document.writeln( "<tr><td>" + kVal + "</td><td>" + xVal + "</td></tr>" );
         }

         document.writeln( "</tbody></table>" );

      </script>
   </head><body></body>
</html>
