<!DOCTYPE html>

<!-- Fig. 5.10: imageborder.html -->
<!-- Borde de imagen en CSS3. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Borde de imagen</title>
      <style type = "text/css">
         div
         {
            border-width: 30px;
            width: 234px;
            padding: 20px 20px;
         }
         #stretch
         {
            -webkit-border-image: url(../Imagenes/border.png) 80 80 80 80 stretch;
            -moz-border-image: url(../Imagenes/border.png) 80 80 80 80 stretch; 
            -o-border-image: url(../Imagenes/border.png) 80 80 80 80 stretch; 
            border-image: url(../Imagenes/border.png) 80 80 80 80 stretch;
         }
         #repeat
         {
            -webkit-border-image: url(../Imagenes/border.png) 34% 34% repeat;
            -moz-border-image: url(../Imagenes/border.png) 34% 34% repeat; 
            -o-border-image: url(../Imagenes/border.png) 34% 34% repeat; 
            border-image: url(../Imagenes/border.png) 34% 34% repeat;
         }
      </style>
   </head>
   <body>
      <h2>Bordes de imagen</h2>
      <img src = "../Imagenes/border.png" alt = "imagen utilizada para demostrar los bordes">
      <div id = "stretch">Estirar el borde de la imagen</div>
      <div id = "repeat">Repetir el borde de la imagen</div>
   </body>
</html>
