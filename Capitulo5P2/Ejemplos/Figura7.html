<!DOCTYPE html>

<!-- Fig. 5.7: textstroke.html -->
<!-- Contorno de texto en CSS3. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Contorno de texto</title>
      <style type = "text/css">
         h1
         {
            color: lightcyan;
            -webkit-text-stroke: 2px black; /* prefijo del proveedor */
            font-size: 500%; /* aumentar el tamaño de la fuente */
         }
      </style>
   </head>
<body>
   <h1>Contorno de texto</h1>
</body>
</html>
