<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 5.5</title>
    <style>
        .caja {
            width: 100px;
            height: 100px;
            display: inline-block;
            margin: 15px;
            text-align: center;
            line-height: 100px;
            border: 3px solid black;
        }
        .caja1 {
            border-radius: 10px;
            background-color: #9be7a5;
        }
        .caja2 {
            border-radius: 50px;
            background-color: #f3a6a6;
        }
        .caja3 {
            border-radius: 100px;
            background-color: #8fd3f4;
        }
    </style>
</head>
<body>

    <div class="caja caja1"><strong>10px</strong></div>
    <div class="caja caja2"><strong>50px</strong></div>
    <div class="caja caja3"><strong>100px</strong></div>

</body>
</html>
