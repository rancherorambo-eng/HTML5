<!DOCTYPE html>

<!-- Fig. 5.13 Modificada: Ejercicio 5.10.html -->
<!-- Elementos de Inclinación y de transformación en CSS3. -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Ejercicio 5.10 - Inclinar</title>
      <style type = "text/css">
         .skew .textbox 
         {
            margin-left: 75px;
            background: lightseagreen;
            height: 95px;
            width: 210px;
            padding: 22px 0;
            text-align: center;
            font-size: 230%;
            border: 3px solid #075e54;
            border-radius: 12px;
            animation: skew 5s infinite alternate ease-in-out;
         }
         @keyframes skew 
         {
            0%   { transform: skewY(0deg) skewX(0deg); }
            50%  { transform: skewY(25deg) skewX(0deg); }
            100% { transform: skewY(25deg) skewX(25deg); }
         }
      </style>
   </head>
   <body>
      <div class = "box skew">
         <div class = "textbox">Texto inclinado</div>
      </div>
   </body>
</html>
